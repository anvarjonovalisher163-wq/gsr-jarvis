# nginx site config for GSR Jarvis.
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gsr-jarvis
#   sudo ln -s /etc/nginx/sites-available/gsr-jarvis /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: after DNS points at the VPS, run certbot — it rewrites this file
# with the certificate paths and the 80->443 redirect automatically:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d jarvis.example.uz
#
# NOTE: PWA install and Web Push REQUIRE HTTPS — certbot is not optional.

server {
    listen 80;
    server_name jarvis.example.uz;   # <-- replace with your domain

    # Built frontend (React PWA)
    root /opt/gsr-jarvis/frontend/dist;
    index index.html;

    # API -> FastAPI (uvicorn on 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for streaming chat responses (no buffering)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Service worker must never be cached aggressively
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
